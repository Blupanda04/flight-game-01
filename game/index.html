<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ridge Runner — a flight game over the valley</title>
<style>
  html, body { margin: 0; padding: 0; background: #0a141e; height: 100%; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; font-family: Arial, Helvetica, sans-serif; }
  #wrap { width: 1280px; max-width: 100vw; }
  canvas { display: block; width: 1280px; max-width: 100vw; height: auto; background: #2f6fb2; }
  #help { color: #9fb6c6; font-size: 14px; text-align: center; padding: 10px 16px 0; line-height: 1.6; }
  #help b { color: #e8f4ff; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="800"></canvas>
  <div id="help">
    <b>W / ↑</b> climb &nbsp;·&nbsp; <b>S / ↓</b> descend &nbsp;·&nbsp; <b>A D / ← →</b> turn &nbsp;·&nbsp;
    <b>E / Q</b> or <b>Shift / Ctrl</b> throttle &nbsp;·&nbsp; <b>P</b> pause &nbsp;·&nbsp; <b>M</b> mute<br>
    Fly the rings, mind the fuel, and bring her home in one piece.
  </div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
